# ============================================================
# Nautilus Trader - 市场发现与匹配系统配置 (Final)
# 在 Match 阶段根据配置文件进行名称预处理
# ============================================================

# 系统配置
instance_id: nautilus-001
log_level: INFO

# ============================================================
# 市场发现配置
# ============================================================
market_discovery:
  actor_id: MarketDiscovery-001
  output_dir: output
  schedule_cron: "0 */6 * * *"
  
  # ------------------------------------------------------------
  # Polymarket 爬虫配置
  # ------------------------------------------------------------
  polymarket:
    enabled: true
    
    # 要爬取的运动项目（使用原始名称或标准名称都可以）
    sports:
      - Soccer
      - Basketball
      - Tennis
      - American Football
    
    # 要爬取的赛事（使用原始名称或标准名称都可以）
    competitions:
      Soccer:
        - EPL                      # 使用常见缩写
        - La Liga
        - Champions League
        - Serie A
      Basketball:
        - NBA
      Tennis:
        - Grand Slam
      American Football:
        - NFL
    
    # 限制选项
    max_events_per_sport: 0
    max_events_per_competition: 100
    max_total_events: 1000
    rate_limit_seconds: 1.0
  
  # ------------------------------------------------------------
  # OrbitExch 爬虫配置
  # ------------------------------------------------------------
  orbitexch:
    enabled: true
    
    # 要爬取的运动项目（使用原始名称或标准名称都可以）
    sports:
      - American Football
      - Soccer
      - Basketball
    
    # 要爬取的赛事（使用原始名称或标准名称都可以）
    competitions:
      American Football:
        - NFL
      Soccer:
        - English Premier League  # 使用完整名称
        - Spanish La Liga
        - UEFA Champions League
      Basketball:
        - NBA
    
    # 限制选项
    max_competitions_per_sport: 5
    max_events_per_competition: 0
    
    # 浏览器设置
    headless: false
    base_url: "https://orbitexch.com"

# ============================================================
# 市场匹配配置（在这里进行名称预处理）
# ============================================================
market_matching:
  actor_id: MarketMatching-001
  verbose: true
  
  # ------------------------------------------------------------
  # 预处理配置（根据配置文件进行名称标准化）
  # ------------------------------------------------------------
  preprocessor:
    # 是否启用预处理
    enabled: true
    
    # 标准化选项
    normalize_sport: true
    normalize_competition: true
    normalize_team_names: true
    strip_whitespace: true
    
    # Sport 名称映射表
    # 格式: {原始名称: 标准名称}
    sport_mappings:
      # 将 Football 统一为 Soccer
      Football: Soccer
      Association Football: Soccer
      
      # 将 Gridiron 统一为 American Football
      Gridiron: American Football
      
      # 其他运动保持不变
      Soccer: Soccer
      Basketball: Basketball
      Tennis: Tennis
      American Football: American Football
      Baseball: Baseball
      Ice Hockey: Ice Hockey
    
    # Competition 名称映射表
    # 格式: {原始名称: 标准名称}
    competition_mappings:
      # English Premier League 的各种写法
      EPL: English Premier League
      Premier League: English Premier League
      English Premier League: English Premier League
      
      # Spanish La Liga 的各种写法
      La Liga: Spanish La Liga
      LaLiga: Spanish La Liga
      Spanish La Liga: Spanish La Liga
      
      # UEFA Champions League 的各种写法
      UCL: UEFA Champions League
      Champions League: UEFA Champions League
      UEFA Champions League: UEFA Champions League
      
      # Italian Serie A
      Serie A: Italian Serie A
      Italian Serie A: Italian Serie A
      
      # German Bundesliga
      Bundesliga: German Bundesliga
      German Bundesliga: German Bundesliga
      
      # French Ligue 1
      Ligue 1: French Ligue 1
      French Ligue 1: French Ligue 1
      
      # NBA
      NBA: NBA
      
      # NFL
      NFL: NFL
      
      # NCAA
      NCAA: NCAA
      NCAA Football: NCAA Football
      NCAA Basketball: NCAA Basketball
    
    # 队名映射表
    # 格式: {原始名称: 标准名称}
    team_name_mappings:
      # Manchester United
      Man Utd: Manchester United
      Man United: Manchester United
      Manchester Utd: Manchester United
      MUFC: Manchester United
      Manchester United: Manchester United
      Manchester United FC: Manchester United
      
      # Manchester City
      Man City: Manchester City
      Manchester City FC: Manchester City
      MCFC: Manchester City
      Manchester City: Manchester City
      
      # Liverpool
      Liverpool FC: Liverpool
      LFC: Liverpool
      Liverpool: Liverpool
      
      # Chelsea
      Chelsea FC: Chelsea
      CFC: Chelsea
      Chelsea: Chelsea
      
      # Arsenal
      Arsenal FC: Arsenal
      Arsenal: Arsenal
      
      # Tottenham Hotspur
      Tottenham: Tottenham Hotspur
      Spurs: Tottenham Hotspur
      THFC: Tottenham Hotspur
      Tottenham Hotspur: Tottenham Hotspur
      
      # Newcastle United
      Newcastle: Newcastle United
      NUFC: Newcastle United
      Newcastle United: Newcastle United
      
      # West Ham United
      West Ham: West Ham United
      West Ham United: West Ham United
  
  # ------------------------------------------------------------
  # 匹配器配置
  # ------------------------------------------------------------
  matcher:
    # 匹配字段
    match_sport: true
    match_competition: true
    match_home_team: true
    match_away_team: true
    
    # 匹配选项
    allow_team_swap: true
    min_confidence: 0.6
    
    # 匹配器类型
    matcher_class: DefaultMatcher

# ============================================================
# Web 面板配置
# ============================================================
web_panel:
  enabled: true
  host: "0.0.0.0"
  port: 8000
  auto_open_browser: true

# ============================================================
# 配置说明
# ============================================================
# 
# 工作流程：
# 
# 1. 爬虫阶段：
#    - 爬虫直接保存原始数据（不做任何转换）
#    - Polymarket 返回 "Football" → 保存 "Football"
#    - OrbitExch 返回 "Soccer" → 保存 "Soccer"
# 
# 2. 文件存储：
#    polymarket_events.json: {sport: "Football", competition: "EPL"}
#    orbitexch_events.json: {sport: "Soccer", competition: "English Premier League"}
# 
# 3. Match 阶段预处理：
#    - 加载配置文件中的映射表
#    - 对两边的数据进行预处理
#    - Polymarket: "Football" → "Soccer", "EPL" → "English Premier League"
#    - OrbitExch: "Soccer" → "Soccer", "English Premier League" → "English Premier League"
# 
# 4. 匹配：
#    - "Soccer" == "Soccer" ✅
#    - "English Premier League" == "English Premier League" ✅
# 
# ============================================================
# 添加新映射的方法
# ============================================================
# 
# 如果发现新的名称变体，只需在配置文件中添加：
# 
# sport_mappings:
#   Futbol: Soccer  # 添加新的 sport 映射
# 
# competition_mappings:
#   Prem: English Premier League  # 添加新的 competition 映射
# 
# team_name_mappings:
#   United: Manchester United  # 添加新的队名映射
# 
# 然后重启服务即可生效
# 
# ============================================================
# 映射规则建议
# ============================================================
# 
# 1. 选择最正式的全名作为标准名称：
#    ✅ English Premier League（正式全名）
#    ❌ EPL（缩写）
# 
# 2. 所有变体都映射到同一个标准名称：
#    EPL → English Premier League
#    Premier League → English Premier League
#    English Premier League → English Premier League
# 
# 3. 即使是标准名称本身也要在映射表中：
#    Soccer → Soccer（保持不变）
#    这样预处理逻辑统一，都查映射表
# 
